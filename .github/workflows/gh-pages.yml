name: Build and deploy to gh-pages
on:
   push:
     branches:
       - master
   workflow_dispatch: # Allow to run workflow manually

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 📥
        uses: actions/checkout@v7.0.1
        with:
          token: '${{ secrets.GITHUB_TOKEN }}'
          fetch-depth: '0' # https://github.com/timvink/mkdocs-git-revision-date-localized-plugin#note-when-using-build-environments

      - name: Install dependencies 🐄
        run: |
          sudo apt-get -y update
          sudo apt-get -y install python3-pip
          python -m venv venv
          source ./venv/bin/activate
          pip install -r requirements.txt

      - name: Build site 🔧
        run: |
          source ./venv/bin/activate
          python build_i18n_site.py

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4.9.0
        with:
          token: '${{ secrets.GITHUB_TOKEN }}'
          git-config-name: 'test'
          git-config-email: 'test@test.test'
          branch: gh-pages # The branch the action should deploy to.
          folder: site # The folder the action should deploy.
